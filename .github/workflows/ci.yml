name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  agent-test-and-build:
    name: Rust Agent (Build & Test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent -> agent/target"
      - name: Clippy Lint Gate
        working-directory: agent
        # 静态检查门禁：任何 warning/error 都使 CI 变红（本地已清零）
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Run Cargo Tests
        working-directory: agent
        # --locked：依赖图以 Cargo.lock 为准，防止 CI 悄悄升级依赖
        run: cargo test --workspace --locked
      - name: Build Agent Release Binary
        working-directory: agent
        run: cargo build --release --locked -p embedded-clion-agent
      - name: Upload Agent Binary
        uses: actions/upload-artifact@v4
        with:
          name: embedded-clion-agent-windows
          path: agent/target/release/embedded-clion-agent.exe
          if-no-files-found: error

  plugin-test-and-build:
    name: CLion Plugin (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
      - name: Run Plugin Tests
        working-directory: plugin
        run: ./gradlew test
      - name: Verify Plugin (API/ABI compatibility check)
        working-directory: plugin
        # 插件验证：对固定版本 CLion 2026.2.2 校验 since-build 与 API 兼容性
        # （构建依赖已 pinned 同版本，verifyPlugin 复用缓存离线可跑）
        run: ./gradlew verifyPlugin
      - name: Build Plugin Distribution
        working-directory: plugin
        run: ./gradlew buildPlugin
      - name: Upload Plugin Distribution
        uses: actions/upload-artifact@v4
        with:
          name: embedded-debug-plugin-distribution
          path: plugin/build/distributions/*.zip
          if-no-files-found: error
