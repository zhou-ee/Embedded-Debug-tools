name: CI

on:
  push:
    branches: [ main, dev ]
  pull_request:
    branches: [ main, dev ]

jobs:
  agent-test-and-build:
    name: Rust Agent (Build & Test)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: "agent -> agent/target"
      - name: Run Cargo Tests
        working-directory: agent
        run: cargo test --workspace
      - name: Build Agent Release Binary
        working-directory: agent
        run: cargo build --release -p embedded-clion-agent

  plugin-test-and-build:
    name: CLion Plugin (Build & Test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3
      - name: Run Plugin Tests
        working-directory: plugin
        run: ./gradlew test
      - name: Build Plugin Distribution
        working-directory: plugin
        run: ./gradlew buildPlugin
