group=org.embedded.monitor
version=V1.2.23
# Opt-out flag for bundling Kotlin standard library -> https://jb.gg/intellij-platform-kotlin-stdlib
kotlin.stdlib.default.dependency=false
# Enable Gradle Configuration Cache -> https://docs.gradle.org/current/userguide/configuration_cache.html
org.gradle.configuration-cache=true
# Enable Gradle Build Cache -> https://docs.gradle.org/current/userguide/build_cache.html
org.gradle.caching=true
# IntelliJ Platform 构建内存需求较大：默认 512m daemon 曾在解析 CLion 平台依赖时被压垮
org.gradle.jvmargs=-Xmx1g -XX:MaxMetaspaceSize=640m
# 网络停滞快速失败：IIPG 解析 IDE 下载 URL 自带的 HTTP 客户端无超时，
# 连接被远端 RST/黑洞时会把配置期挂死数十分钟以上（15s 内不响应即报错重试）
systemProp.org.gradle.internal.http.connectionTimeout=15000
systemProp.org.gradle.internal.http.socketTimeout=15000
org.gradle.jvmargs.cleaner.currentJvm=false
